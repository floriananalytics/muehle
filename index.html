<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0c0a0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Konsole">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>Konsole</title>
<style>
  :root{
    --schwarz:#0c0a0c; --schwarz2:#151216; --elf:#f0e2c4; --elf-40:rgba(240,226,196,.4); --elf-15:rgba(240,226,196,.15); --rot:#b8322a;
    /* Erweiterte Palette */
    --senf:#e8a93a; --senf-d:#b07a22; --petrol:#2f8a90; --petrol-d:#123e42; --zinnober:#d4552e; --zinnober-d:#8f3419;
    --nebelblau:#7fb2c9; --nebelblau-d:#3f6f85; --olive:#9a9a3c; --olive-d:#5f6020; --pflaume:#8a4f8e; --pflaume-d:#4f2a54; --rauch:#6f6a66;
    /* Spielfarben: von der Hülle je Spiel gesetzt (applyColors). *-text ist die Farbe oder Elfenbein, je nach Kontrast */
    --spieler1:var(--senf); --spieler1-d:var(--senf-d); --spieler2:var(--petrol); --spieler2-d:var(--petrol-d); --akzent:var(--senf);
    --spieler1-text:var(--senf); --spieler2-text:var(--elf); --akzent-text:var(--senf);
    --mono:"SF Mono","Roboto Mono","Fira Mono","DejaVu Sans Mono",Consolas,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%;background:var(--schwarz)}
  body{
    color:var(--elf);font-family:var(--mono);font-size:14px;
    display:flex;flex-direction:column;align-items:center;
    padding:calc(env(safe-area-inset-top) + 8px) 12px calc(env(safe-area-inset-bottom) + 16px);
    background:
      radial-gradient(ellipse 80% 50% at 50% 0%,rgba(47,138,144,.14),transparent 70%),
      var(--schwarz);
  }
  body::after{ /* Scanlinien */
    content:"";position:fixed;inset:0;pointer-events:none;z-index:9;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);
    mix-blend-mode:multiply;
  }
  [hidden]{display:none!important}
  .frame{width:100%;max-width:470px}
  header{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:6px 8px;padding:6px 2px 10px;border-bottom:1px solid var(--elf-15)}
  h1{margin:0;font-weight:500;font-size:26px;letter-spacing:.32em;color:var(--elf)}
  h1 small{display:block;font-size:10px;letter-spacing:.18em;color:var(--elf-40);margin-top:2px}
  .btns{display:flex;gap:6px;flex-shrink:0;margin-left:auto}
  .btns button{white-space:nowrap}
  h1.long{font-size:20px;letter-spacing:.2em}
  @media (max-width:380px){.btns button{padding:7px 7px;font-size:11px} h1{font-size:22px} h1.long{font-size:17px;letter-spacing:.16em}}
  button{
    font:inherit;font-size:12px;letter-spacing:.06em;color:var(--elf);background:transparent;
    border:1px solid var(--elf-40);border-radius:3px;padding:7px 10px;cursor:pointer;
  }
  button:disabled{opacity:.3;cursor:default}
  button:not(:disabled):active{background:var(--elf-15)}
  button:focus-visible{outline:2px solid var(--akzent);outline-offset:2px}
  #game{width:100%;min-height:40px}
  #game.reveal{animation:reveal .3s steps(20,end)} /* Arcade: Spielfeld erscheint zeilenweise von oben */
  @keyframes reveal{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
  /* Bildschirmtasten für Arcade-Module: flache Rechtecke, dünne Elfenbein-Kontur, gedrückt halten möglich */
  #pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
  #pad button{min-height:56px;border:1px solid var(--elf-40);border-radius:2px;font-size:20px;color:var(--elf);background:transparent;touch-action:none;user-select:none;-webkit-user-select:none}
  #pad button.on{background:var(--elf-15)}
  #hud{
    position:relative;overflow:hidden;margin-top:6px;border:1px solid var(--elf-15);border-left:3px solid var(--akzent);
    padding:9px 12px;min-height:66px;line-height:1.45;background:var(--schwarz2)
  }
  #hud .row{font-size:11px;color:var(--elf-40);letter-spacing:.12em;margin-bottom:3px}
  #hud .msg{font-size:14px;color:var(--elf)}
  #hud .msg::after{content:"▮";margin-left:4px;color:var(--akzent);animation:blink 1.1s steps(1) infinite}
  #hud.alarm{border-left-color:var(--rot)} #hud.win{border-left-color:var(--akzent)}
  #hud.win .msg{color:var(--akzent-text);font-size:17px}
  #hud.win.remis .msg{color:var(--elf)}
  @keyframes blink{50%{opacity:0}}
  /* Fortschrittsleiste: Animation nur auf transform, läuft auch, während die KI rechnet */
  #bar{position:absolute;left:0;bottom:0;height:2px;width:100%;background:var(--elf);opacity:.6;transform:scaleX(0);transform-origin:left;will-change:transform;pointer-events:none}
  @keyframes barrun{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  #hud.win{--pc:var(--akzent)} #hud.alarm{--pc:var(--rot)} #hud.remis{--pc:var(--elf)}
  #hud.pulse{animation:hudpulse .4s 3}
  @keyframes hudpulse{50%{border-color:var(--pc);box-shadow:0 0 0 1px var(--pc)}}
  /* Overlays: Spielauswahl, Menü und Regeln */
  .overlay{display:none;position:fixed;inset:0;z-index:8;background:var(--schwarz);overflow:auto;justify-content:center;align-items:flex-start;
    padding:calc(env(safe-area-inset-top) + 16px) 12px calc(env(safe-area-inset-bottom) + 16px)}
  .overlay.open{display:flex}
  .panel{position:relative;width:100%;max-width:470px;padding:22px 18px 18px;border:1px solid var(--elf-15)}
  .corner{position:absolute;width:14px;height:14px;border:0 solid var(--akzent)}
  .corner.tl{top:-1px;left:-1px;border-top-width:2px;border-left-width:2px}
  .corner.tr{top:-1px;right:-1px;border-top-width:2px;border-right-width:2px}
  .corner.bl{bottom:-1px;left:-1px;border-bottom-width:2px;border-left-width:2px}
  .corner.br{bottom:-1px;right:-1px;border-bottom-width:2px;border-right-width:2px}
  .panel h1{margin:0 0 20px}
  /* Spielauswahl als Liste: links Vorschau, rechts Name, Untertitel, Bilanz */
  .tiles{display:grid;grid-template-columns:1fr;gap:10px}
  .tile{display:flex;align-items:center;gap:14px;padding:8px 12px 8px 8px;border:1px solid var(--rauch);text-align:left;color:var(--elf);border-radius:3px}
  .tile.last{box-shadow:0 0 0 1px var(--tile)} /* zuletzt gespielt: doppelter Akzentrahmen in der Akzentfarbe der Kachel */
  .tile svg{width:88px;height:88px;flex-shrink:0;display:block}
  .tile .info{display:flex;flex-direction:column;gap:4px;min-width:0}
  .tile .tname{display:block;font-size:16px;letter-spacing:.26em}
  .tile small{display:block;font-size:9px;letter-spacing:.14em;color:var(--elf-40)}
  .tile .bal{font-size:10px;letter-spacing:.12em;color:var(--elf-40);margin-top:2px}
  .sys{display:flex;justify-content:space-between;align-items:center;margin-top:18px;padding-top:10px;border-top:1px solid var(--elf-15);font-size:10px;letter-spacing:.14em;color:var(--elf-40)}
  .sys button{font-size:10px;padding:4px 8px}
  #gameView{border-color:var(--akzent)}
  /* Bilanz als drei Zähler im HUD-Stil */
  .counters{display:flex;gap:8px;padding-top:12px;border-top:1px solid var(--elf-15)}
  .ctr{flex:1;border:1px solid var(--elf-15);border-left:3px solid var(--akzent);background:var(--schwarz2);padding:6px 8px;min-width:0}
  .ctr span{display:block;font-size:9px;letter-spacing:.12em;color:var(--elf-40);white-space:nowrap} .ctr b{font-size:16px;font-weight:500}
  .statfoot{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:10px;letter-spacing:.1em;color:var(--elf-40);min-height:18px}
  .statfoot b{color:var(--elf);font-weight:500} .statfoot .link{padding:0;font-size:10px}
  /* Ergebnisfeld unter dem HUD */
  #result{margin-top:8px;border:1px solid var(--elf-15);border-left:3px solid var(--akzent);background:var(--schwarz2);padding:9px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  #result.alarm{border-left-color:var(--rot)} #result.remis{border-left-color:var(--elf)}
  #result .rline{font-size:13px;letter-spacing:.14em} #result.win .rline{color:var(--akzent-text)}
  #result .rbtns{display:flex;gap:6px}
  #result .rlog{width:100%;font-size:11px;letter-spacing:.1em;color:var(--elf-40)} #result .rbest{width:100%;font-size:11px;letter-spacing:.14em;color:var(--senf)}
  /* Logbuch (Arcade) */
  .lbl.h{margin-top:16px;padding-top:12px;border-top:1px solid var(--elf-15);display:block}
  .logbook{width:100%;border-collapse:collapse;font-size:11px;letter-spacing:.08em;margin-top:6px}
  .logbook th{font-weight:500;color:var(--elf-40);text-align:left;padding:4px 6px;font-size:9px;letter-spacing:.12em}
  .logbook td{padding:5px 6px;border-top:1px solid var(--elf-15)} .logbook td.n,.logbook th.n{text-align:right} .logbook td.leer{color:var(--elf-40)}
  .modes,.actions{display:grid;gap:8px}
  .modes{margin-bottom:16px} .actions{margin:18px 0 16px}
  .big{min-height:56px;width:100%;font-size:15px;letter-spacing:.14em}
  .big.on{background:var(--akzent);color:var(--schwarz);border-color:var(--akzent)}
  .opt{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
  .lbl{font-size:11px;letter-spacing:.12em;color:var(--elf-40)}
  .seg{display:flex}
  .seg button{flex:1;min-height:44px;border-radius:0;margin-left:-1px}
  .seg button:first-child{border-radius:3px 0 0 3px;margin-left:0} .seg button:last-child{border-radius:0 3px 3px 0}
  .seg button.on{background:var(--akzent);color:var(--schwarz);border-color:var(--akzent);position:relative;z-index:1}
  .link{border:none;padding:12px 0 0;color:var(--elf-40);letter-spacing:.1em;text-decoration:underline;text-underline-offset:3px}
  .link.back{padding:0 0 14px;display:block}
  .phead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .phead h2{margin:0;font-weight:500;font-size:16px;letter-spacing:.3em}
  #confirm .panel h2{margin:0 0 18px;font-weight:500;font-size:16px;letter-spacing:.2em;line-height:1.5}
  #confirm .panel{max-width:360px;margin-top:12vh}
  #rulesBody p{margin:0 0 10px;line-height:1.5;font-size:13px}
  #rulesBody p b{color:var(--akzent-text);font-weight:500}
  @media (prefers-reduced-motion:reduce){ #hud .msg::after,#hud.pulse,#game.reveal{animation:none} #bar{display:none} }
</style>
</head>
<body>
<div class="frame">
<header>
  <h1 id="title">KONSOLE<small id="subtitle">SPIELESAMMLUNG</small></h1>
  <div class="btns">
    <button id="undoBtn" title="Rückgängig" disabled>◀ Zug</button>
    <button id="hintBtn" title="Zugvorschlag" disabled>Tipp</button>
    <button id="pauseBtn" hidden>Pause</button>
    <button id="soundBtn" title="Ton">Ton an</button>
    <button id="menuBtn">Menü</button>
  </div>
</header>
<div id="game"></div>
<div id="pad" hidden></div>
<div id="hud"><div class="row" id="hudRow"></div><div class="msg" id="hudMsg"></div><i id="bar"></i></div>
<div id="result" hidden><div class="rline" id="resultLine"></div><div class="rbtns"><button id="rematchBtn">Revanche</button><button id="resultMenuBtn">Menü</button></div><div class="rlog" id="resultLog" hidden></div><div class="rbest" id="resultBest" hidden>Neuer Bestwert</div></div>
</div>

<div id="menu" class="overlay" role="dialog" aria-modal="true" aria-labelledby="menuTitle">
  <div class="panel" id="selectView">
    <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
    <h1>KONSOLE<small>SPIELESAMMLUNG</small></h1>
    <div class="tiles" id="tiles"></div>
    <button class="link" id="selResume" hidden>Weiterspielen</button>
    <div class="sys"><span id="sysVersion">KONSOLE</span><button id="soundBtn2" title="Ton">Ton an</button></div>
  </div>
  <div class="panel" id="gameView" hidden>
    <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
    <button class="link back" id="backBtn">◀ Zurück zur Spielauswahl</button>
    <h1 id="menuTitle">MÜHLE<small id="menuSubtitle"></small></h1>
    <div id="boardMenu">
    <div class="modes">
      <button class="big" id="modeAi" aria-pressed="true">Gegen Computer</button>
      <button class="big" id="mode2p" aria-pressed="false">Zwei Spieler</button>
    </div>
    <div class="opt" id="levelOpt"><span class="lbl">STÄRKE</span><div class="seg" id="levelSeg"></div></div>
    <div class="opt"><span class="lbl">ANFANG</span>
      <div class="seg" id="startSeg"><button data-v="1">Ich</button><button data-v="2">Computer</button></div>
    </div>
    <div class="actions">
      <button class="big" id="resumeBtn" hidden>Weiterspielen</button>
      <button class="big" id="newBtn">Neue Partie</button>
    </div>
    <div class="counters" aria-label="Bilanz gegen Computer"><div class="ctr"><span>SIEGE</span><b id="statW">0</b></div><div class="ctr"><span>REMIS</span><b id="statD">0</b></div><div class="ctr"><span>NIEDERLAGEN</span><b id="statL">0</b></div></div>
    <div class="statfoot"><span id="statHWrap" hidden>mit Hilfe <b id="statH">0</b></span><button class="link" id="statReset">zurücksetzen</button></div>
    </div>
    <div id="arcadeMenu" hidden>
      <div class="actions"><button class="big" id="resumeBtn2" hidden>Weiterspielen</button><button class="big" id="startBtn">Start</button></div>
      <span class="lbl h">LOGBUCH</span>
      <table class="logbook" id="logbook"></table>
      <div class="statfoot"><span></span><button class="link" id="logReset">zurücksetzen</button></div>
    </div>
    <button class="link" id="rulesBtn">Regeln</button>
  </div>
</div>

<div id="confirm" class="overlay" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle">
  <div class="panel">
    <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
    <h2 id="confirmTitle">LAUFENDE PARTIE BEENDEN?</h2>
    <div class="actions"><button class="big" id="confirmYes">Beenden</button><button class="big" id="confirmNo">Zurück</button></div>
  </div>
</div>

<div id="rules" class="overlay" role="dialog" aria-modal="true" aria-labelledby="rulesTitle">
  <div class="panel">
    <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
    <div class="phead"><h2 id="rulesTitle">REGELN</h2><button id="rulesClose">Schließen</button></div>
    <div id="rulesBody"></div>
  </div>
</div>

<script src="./games/muehle.js"></script>
<script src="./games/vier-gewinnt.js"></script>
<script src="./games/dame.js"></script>
<script src="./games/sonde.js"></script>
<script>
/* ---------- Ton und Vibration ---------- */
let audio=null, soundOn=true, unlocked=false;
function ensureAudio(){
  try{
    audio=audio||new (window.AudioContext||window.webkitAudioContext)();
    if(audio.state!=='running') Promise.resolve(audio.resume()).catch(()=>{});
  }catch(e){}
  return audio;
}
// iOS: beim ersten Tippen den AudioContext erzeugen, freischalten und einen stummen Puffer abspielen; später bei Bedarf erneut resume()
function unlockAudio(){
  const a=ensureAudio(); if(!a||unlocked) return;
  try{ const src=a.createBufferSource(); src.buffer=a.createBuffer(1,1,a.sampleRate); src.connect(a.destination); src.start(0); unlocked=true; }catch(e){}
}
['touchstart','pointerdown','keydown'].forEach(ev=>document.addEventListener(ev,unlockAudio,{passive:true,capture:true}));
document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&audio&&audio.state!=='running') Promise.resolve(audio.resume()).catch(()=>{}); });
function tone(freq,dur,type,gain){
  if(!soundOn) return;
  try{
    const a=ensureAudio();
    const o=a.createOscillator(), g=a.createGain(), t=a.currentTime;
    o.type=type||'sine'; o.frequency.value=freq;
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(gain||0.08,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur+0.02);
  }catch(e){}
}
function buzz(pattern){ if(!soundOn||!navigator.vibrate) return; try{ navigator.vibrate(pattern); }catch(e){} } // Vibration folgt der Ton-Einstellung
const SFX={
  place:()=>{ tone(660,0.09,'triangle'); buzz(10); },
  move:()=>{ tone(520,0.06,'triangle'); setTimeout(()=>tone(700,0.07,'triangle'),60); buzz(10); },
  mill:()=>{ tone(440,0.12,'square',0.05); setTimeout(()=>tone(660,0.16,'square',0.05),120); buzz([30,40,30]); },
  take:()=>{ tone(160,0.22,'sawtooth',0.06); buzz(60); },
  win:()=>{ [440,554,659,880].forEach((f,i)=>setTimeout(()=>tone(f,0.18,'triangle'),i*110)); buzz([40,60,40,60]); },
  lose:()=>{ [330,262,196].forEach((f,i)=>setTimeout(()=>tone(f,0.22,'sawtooth',0.05),i*160)); buzz(120); },
  draw:()=>{ tone(494,0.14,'triangle',0.06); setTimeout(()=>tone(494,0.14,'triangle',0.06),200); buzz([30,30]); },
  arcadeEnd:()=>{ tone(440,0.12,'square',0.05); setTimeout(()=>tone(220,0.22,'square',0.05),140); buzz(120); },
};

/* ---------- Speicher ---------- */
const store={
  get(k,d){ try{ const v=localStorage.getItem('muehle:'+k); return v===null?d:JSON.parse(v);}catch(e){return d;} },
  set(k,v){ try{ localStorage.setItem('muehle:'+k,JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem('muehle:'+k); }catch(e){} }
};
(function migrate(){ // alte Schlüssel ohne Spiel-ID einmalig nach Mühle übernehmen
  const st=store.get('stats',null);
  if(st){ if(store.get('stats:muehle',null)===null) store.set('stats:muehle',{w:st.w||0,d:st.d||0,l:st.l||0}); store.del('stats'); }
  const se=store.get('settings',null);
  if(se){ if(store.get('settings:muehle',null)===null) store.set('settings:muehle',{mode:se.mode,level:se.level,starter:se.starter}); if(se.sound===false&&store.get('sound',null)===null) store.set('sound',false); store.del('settings'); }
})();
soundOn=store.get('sound',true)!==false;

/* ---------- Farben ---------- */
const lum=hex=>{ const c=[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16)/255).map(v=>v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)); return .2126*c[0]+.7152*c[1]+.0722*c[2]; };
const contrast=(a,b)=>{ const x=lum(a), y=lum(b); return (Math.max(x,y)+.05)/(Math.min(x,y)+.05); };
const textOk=hex=>contrast(hex,'#0c0a0c')>=4.5; // Text nur in Farben mit mindestens 4,5:1 auf Schwarz, sonst Elfenbein
function applyColors(meta){
  const r=document.documentElement.style, [a,b]=meta.farben, k=meta.akzent;
  r.setProperty('--spieler1',a.hex); r.setProperty('--spieler1-d',a.dunkel); r.setProperty('--spieler2',b.hex); r.setProperty('--spieler2-d',b.dunkel); r.setProperty('--akzent',k.hex);
  r.setProperty('--spieler1-text',textOk(a.hex)?a.hex:'var(--elf)'); r.setProperty('--spieler2-text',textOk(b.hex)?b.hex:'var(--elf)'); r.setProperty('--akzent-text',textOk(k.hex)?k.hex:'var(--elf)');
}

/* ---------- Hülle ---------- */
const $=id=>document.getElementById(id);
const GAMES=window.GAMES||{}, GAME_ORDER=['muehle','vier-gewinnt','dame','sonde'];
const isArcade=()=>!!(game&&game.meta.typ==='arcade');
let game=null, gameId=null, settings={mode:'ai',level:'2',starter:'1'}, stats={w:0,d:0,l:0,h:0}, started=false, over=false, twoPlayer=false, helped=false; // helped: Zugvorschlag in dieser Partie genutzt
const reduceMotion=()=>!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);
const restartClass=(el,cls)=>{ el.classList.remove(cls); void el.getBoundingClientRect(); el.classList.add(cls); };
function refreshUndo(){ if(isArcade()){ $('pauseBtn').disabled=!(started&&!over); return; } $('undoBtn').disabled=!(game&&started&&!over&&game.canUndo()); $('hintBtn').disabled=!(game&&started&&!over&&!twoPlayer&&game.canHint&&game.canHint()); }
/* Logbuch (Arcade): bis zu fünf Einträge {score, felder, datum} absteigend */
const logOf=id=>store.get('log:'+id,[])||[];
const bestOf=id=>{ const l=logOf(id); return l.length?l[0].score:0; };
function addLog(id,entry){ const l=logOf(id); l.push(entry); l.sort((a,b)=>b.score-a.score); store.set('log:'+id,l.slice(0,5)); }
const fmtDate=ts=>{ const d=new Date(ts); return `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getFullYear()%100).padStart(2,'0')}`; };
const hooks={
  sfx:SFX, vibrate:buzz, tone, onControl:null,
  bestwert(){ return bestOf(gameId); },
  telemetry(fields){ $('hudRow').textContent=fields.slice(0,4).map(f=>`${f.label} ${f.value}`).join(' | '); },
  hud(text,cls){ $('hudMsg').textContent=text; $('hud').className=cls||''; refreshUndo(); },
  hudRow(text){ $('hudRow').textContent=text; },
  progress(ms){ const b=$('bar'); b.style.animation='none'; if(ms>0){ void b.offsetWidth; b.style.animation=`barrun ${ms}ms linear forwards`; } },
  onEnd(r){ // Brett: {win:1|2, human?:1|2} oder {draw:true, grund}; Arcade: {score, felder:[{label,value}], bestwert}
    over=true;
    if(isArcade()){
      const best=r.score>bestOf(gameId);
      if(r.score>0) addLog(gameId,{score:r.score,felder:r.felder||[],datum:Date.now()});
      hooks.hud(game.meta.endTitel||'ENDE','alarm'); SFX.arcadeEnd(); if(best) setTimeout(SFX.win,400);
      restartClass($('hud'),'pulse'); refreshUndo();
      showResult(game.meta.endTitel||'ENDE',best?'win':'alarm',{log:(r.felder||[]).map(f=>`${f.label} ${f.value}`).join(' | '),best});
      return;
    }
    const f=game.meta.farben, human=r.human||1; let line, cls;
    if(r.draw){ line='Remis'+(r.grund?' - '+r.grund:''); cls='remis'; hooks.hud('Remis'+(r.grund?' - '+r.grund:'.'),'win remis'); SFX.draw(); if(!twoPlayer) stats.d++; }
    else if(twoPlayer){ line=`${f[r.win-1].name} gewinnt`; cls='win'; hooks.hud(`${f[r.win-1].name} hat gewonnen.`,'win'); SFX.win(); }
    else if(r.win===human){ line='Sieg'; cls='win'; hooks.hud('Du hast gewonnen.','win'); SFX.win(); stats.w++; if(helped) stats.h++; }
    else { line='Niederlage'; cls='alarm'; hooks.hud('Der Computer hat gewonnen.','alarm'); SFX.lose(); stats.l++; }
    restartClass($('hud'),'pulse');
    if(!twoPlayer) store.set('stats:'+gameId,stats);
    refreshUndo(); showResult(line,cls);
  }
};
function saveSettings(){ if(gameId) store.set('settings:'+gameId,{mode:settings.mode,level:settings.level,starter:settings.starter}); }
function loadGame(id){
  if(game) game.destroy();
  game=GAMES[id]; gameId=id; const m=game.meta;
  applyColors(m);
  $('title').firstChild.textContent=m.name; $('subtitle').textContent=m.untertitel; $('title').classList.toggle('long',m.name.length>8);
  $('menuTitle').firstChild.textContent=m.name; $('menuSubtitle').textContent=m.untertitel;
  const arcade=m.typ==='arcade', stufen=m.stufen||[];
  $('boardMenu').hidden=arcade; $('arcadeMenu').hidden=!arcade;
  $('undoBtn').hidden=arcade; $('hintBtn').hidden=arcade; $('pauseBtn').hidden=!arcade;
  buildPad(arcade?(m.steuerung||[]):[]);
  $('levelSeg').innerHTML=stufen.map((n,i)=>`<button data-v="${i+1}">${n}</button>`).join('');
  const st=store.get('settings:'+id,{})||{};
  settings={mode:st.mode==='2p'?'2p':'ai', level:stufen[+st.level-1]?String(st.level):'2', starter:String(st.starter)==='2'?'2':'1'};
  const sv=store.get('stats:'+id,{})||{}; stats={w:sv.w||0,d:sv.d||0,l:sv.l||0,h:sv.h||0};
  started=false; over=false; helped=false; twoPlayer=settings.mode==='2p';
  $('hud').className=''; hooks.progress(0); hideResult();
  game.mount($('game'),hooks);
  hooks.hudRow(''); hooks.hud('Neue Partie im Menü starten.');
  store.set('lastGame',id);
}
function newGame(){
  started=true; over=false; helped=false; hideResult();
  if(isArcade()){ twoPlayer=false; reveal(); game.start(); refreshUndo(); return; }
  twoPlayer=settings.mode==='2p'; saveSettings();
  game.newGame({twoPlayer,level:+settings.level,starter:+settings.starter});
  refreshUndo();
}
function reveal(){ if(reduceMotion()) return; const g=$('game'); restartClass(g,'reveal'); g.addEventListener('animationend',()=>g.classList.remove('reveal'),{once:true}); }
/* Bildschirmtasten: die Hülle rendert, was meta.steuerung beschreibt, und meldet gedrückt/losgelassen an hooks.onControl */
function buildPad(list){
  const pad=$('pad'); pad.hidden=!list.length;
  pad.innerHTML=list.map(k=>`<button data-k="${k.id}" aria-label="${k.id}" style="${k.zeile?`grid-row:${k.zeile};`:''}${k.spalte?`grid-column:${k.spalte};`:''}">${k.symbol}</button>`).join('');
}
function pauseGame(){ if(isArcade()&&started&&!over&&game.isRunning()) game.pause(); openMenu('game'); }
function resumeGame(){ closeMenu(); if(isArcade()&&started&&!over) game.resume(); }

/* Ergebnisfeld unter dem HUD: erscheint nach dem HUD-Puls */
function showResult(line,cls,extra){
  $('resultLine').textContent=line; $('result').className=cls||'';
  $('resultLog').hidden=!(extra&&extra.log); $('resultLog').textContent=extra&&extra.log?extra.log:'';
  $('resultBest').hidden=!(extra&&extra.best);
  $('rematchBtn').textContent=isArcade()?'Erneut':'Revanche';
  setTimeout(()=>{ if(over) $('result').hidden=false; },reduceMotion()?0:1250);
}
function hideResult(){ $('result').hidden=true; }
function rematch(){ if(!isArcade()&&twoPlayer) settings.starter=settings.starter==='1'?'2':'1'; newGame(); } // gleiche Einstellungen, zu zweit mit getauschtem Anfang; Arcade: erneut starten

/* Menü und Regeln */
const balanceLine=id=>{
  if(GAMES[id].meta.typ==='arcade'){ const b=bestOf(id); return b?`Bestwert ${b}`:'noch kein Bestwert'; }
  const s=store.get('stats:'+id,{})||{}; const w=s.w||0,d=s.d||0,l=s.l||0; return w+d+l?`S ${w} | R ${d} | N ${l}`:'noch keine Partie'; };
function renderLog(){
  const l=logOf(gameId), sek=e=>{ const f=(e.felder||[]).find(x=>/sektor/i.test(x.label)); return f?f.value:'-'; };
  $('logbook').innerHTML='<tr><th>RANG</th><th class="n">PUNKTE</th><th class="n">SEKTOR</th><th class="n">DATUM</th></tr>'+
    (l.length?l.map((e,i)=>`<tr><td>${i+1}</td><td class="n">${e.score}</td><td class="n">${sek(e)}</td><td class="n">${fmtDate(e.datum)}</td></tr>`).join(''):'<tr><td class="leer" colspan="4">noch kein Eintrag</td></tr>');
}
function buildTiles(){ // Liste aus der Modul-Registrierung; ein weiteres Spiel erscheint ohne Änderung an der Hülle
  $('tiles').innerHTML=GAME_ORDER.filter(id=>GAMES[id]).map(id=>{ const m=GAMES[id].meta;
    return `<button class="tile" data-g="${id}" style="border-color:${m.akzent.hex};--tile:${m.akzent.hex}">${m.vorschau()}<span class="info"><span class="tname">${m.name}</span><small>${m.untertitel}</small><span class="bal">${balanceLine(id)}</span></span></button>`; }).join('');
}
function markLastTile(){ const last=store.get('lastGame',null);
  for(const t of $('tiles').children){ const on=t.dataset.g===last; t.classList.toggle('last',on); if(on) t.setAttribute('aria-current','true'); else t.removeAttribute('aria-current'); t.querySelector('.bal').textContent=balanceLine(t.dataset.g); } }
function setSound(on){ soundOn=on; store.set('sound',on); for(const id of ['soundBtn','soundBtn2']) $(id).textContent=on?'Ton an':'Ton aus'; }
function updateMenu(){
  if(isArcade()){ $('resumeBtn2').hidden=!(started&&!over); renderLog(); return; }
  const ai=settings.mode==='ai', f=game.meta.farben;
  $('modeAi').classList.toggle('on',ai); $('modeAi').setAttribute('aria-pressed',ai);
  $('mode2p').classList.toggle('on',!ai); $('mode2p').setAttribute('aria-pressed',!ai);
  $('levelOpt').hidden=!ai;
  for(const b of $('levelSeg').children){ const on=b.dataset.v===settings.level; b.classList.toggle('on',on); b.setAttribute('aria-pressed',on); }
  const sb=$('startSeg').children; sb[0].textContent=ai?'Ich':f[0].name; sb[1].textContent=ai?'Computer':f[1].name;
  for(const b of sb){ const on=b.dataset.v===settings.starter; b.classList.toggle('on',on); b.setAttribute('aria-pressed',on); }
  $('resumeBtn').hidden=!(started&&!over);
  $('statW').textContent=stats.w; $('statD').textContent=stats.d; $('statL').textContent=stats.l;
  $('statH').textContent=stats.h; $('statHWrap').hidden=!stats.h;
}
function showSelect(){ markLastTile(); $('selectView').hidden=false; $('gameView').hidden=true; $('selResume').hidden=!(started&&!over); const t=$('tiles').querySelector(gameId?`[data-g="${gameId}"]`:'.tile'); if(t) t.focus(); }
function showGameMenu(){ updateMenu(); $('selectView').hidden=true; $('gameView').hidden=false; ($('resumeBtn').hidden?$('modeAi'):$('resumeBtn')).focus(); }
function openMenu(view){ $('menu').classList.add('open'); if(view==='select'||!game) showSelect(); else showGameMenu(); }
function closeMenu(){ $('menu').classList.remove('open'); }
function openRules(){
  $('rulesBody').innerHTML=game.meta.regeln.map(r=>`<p><b>${r.titel}</b> ${r.text}</p>`).join('');
  $('rules').classList.add('open'); $('rulesClose').focus();
}
function closeRules(){ $('rules').classList.remove('open'); $('rulesBtn').focus(); }
// Rückfrage, wenn eine Partie läuft: erst nach "Beenden" wird die Aktion ausgeführt
let pendingConfirm=null;
function confirmEnd(action){
  if(!(started&&!over)){ action(); return; }
  pendingConfirm=action; $('confirm').classList.add('open'); $('confirmNo').focus();
}
function closeConfirm(){ $('confirm').classList.remove('open'); pendingConfirm=null; }
// Versionshinweis: einmalig, wenn ein neuer Service Worker eine bereits installierte Version abgelöst hat
function noteNewVersion(){ if(started&&!over){ store.set('newVersion',true); return; } store.del('newVersion'); hooks.hudRow(''); hooks.hud('Neue Version geladen.'); }

(function init(){
  buildTiles();
  setSound(soundOn);
  fetch('./sw.js').then(r=>r.text()).then(t=>{ const m=t.match(/muehle-v(\d+)/); if(m) $('sysVersion').textContent='KONSOLE v'+m[1]; }).catch(()=>{}); // Versionsnummer nur in sw.js gepflegt
  $('hintBtn').addEventListener('click',()=>{
    if(!game||!game.canHint||!game.canHint()) return;
    helped=true; hooks.hud('Bordcomputer analysiert …'); hooks.progress(1500); refreshUndo();
    game.hint(m=>{ hooks.progress(0); if(m!==null&&m!==undefined) game.showHint(m); else hooks.hud('Kein Vorschlag möglich.'); refreshUndo(); });
  });
  $('rematchBtn').addEventListener('click',rematch);
  $('resultMenuBtn').addEventListener('click',()=>openMenu('game'));
  $('menuBtn').addEventListener('click',()=>{ if(isArcade()&&started&&!over) pauseGame(); else openMenu(game?'game':'select'); });
  $('pauseBtn').addEventListener('click',pauseGame);
  $('startBtn').addEventListener('click',()=>confirmEnd(()=>{ newGame(); closeMenu(); }));
  $('resumeBtn2').addEventListener('click',resumeGame);
  $('logReset').addEventListener('click',()=>{ store.set('log:'+gameId,[]); updateMenu(); });
  $('pad').addEventListener('pointerdown',e=>{ const b=e.target.closest('button'); if(!b) return; e.preventDefault(); b.classList.add('on'); if(hooks.onControl) hooks.onControl(b.dataset.k,true); });
  for(const ev of ['pointerup','pointercancel','pointerleave']) $('pad').addEventListener(ev,e=>{ const b=e.target.closest('button'); if(!b||!b.classList.contains('on')) return; b.classList.remove('on'); if(hooks.onControl) hooks.onControl(b.dataset.k,false); },true);
  document.addEventListener('visibilitychange',()=>{ if(document.hidden&&isArcade()&&started&&!over&&game.isRunning()) pauseGame(); }); // App im Hintergrund: automatisch pausieren
  $('tiles').addEventListener('click',e=>{ const t=e.target.closest('.tile'); if(!t) return; const id=t.dataset.g;
    if(id===gameId){ showGameMenu(); return; }
    confirmEnd(()=>{ loadGame(id); showGameMenu(); }); });
  $('confirmYes').addEventListener('click',()=>{ const a=pendingConfirm; closeConfirm(); if(a) a(); });
  $('confirmNo').addEventListener('click',closeConfirm);
  $('selResume').addEventListener('click',resumeGame);
  $('backBtn').addEventListener('click',showSelect);
  $('newBtn').addEventListener('click',()=>confirmEnd(()=>{ newGame(); closeMenu(); }));
  $('resumeBtn').addEventListener('click',resumeGame);
  $('undoBtn').addEventListener('click',()=>{ if(game) game.undo(); refreshUndo(); });
  $('modeAi').addEventListener('click',()=>{ settings.mode='ai'; saveSettings(); updateMenu(); });
  $('mode2p').addEventListener('click',()=>{ settings.mode='2p'; saveSettings(); updateMenu(); });
  $('levelSeg').addEventListener('click',e=>{ const v=e.target.dataset.v; if(v){ settings.level=v; saveSettings(); if(game.setLevel) game.setLevel(+v); updateMenu(); } }); // Stärke wirkt sofort, auch in der laufenden Partie
  $('startSeg').addEventListener('click',e=>{ const v=e.target.dataset.v; if(v){ settings.starter=v; saveSettings(); updateMenu(); } });
  for(const id of ['soundBtn','soundBtn2']) $(id).addEventListener('click',()=>{ setSound(!soundOn); if(soundOn) tone(660,0.08,'triangle'); });
  $('statReset').addEventListener('click',()=>{ stats={w:0,d:0,l:0,h:0}; store.set('stats:'+gameId,stats); updateMenu(); });
  $('rulesBtn').addEventListener('click',openRules);
  $('rulesClose').addEventListener('click',closeRules);
  document.addEventListener('keydown',e=>{
    if(e.key!=='Escape') return;
    if($('confirm').classList.contains('open')) closeConfirm();
    else if($('rules').classList.contains('open')) closeRules();
    else if($('menu').classList.contains('open')&&started&&!over) resumeGame();
  });
  hooks.hud('Spiel im Menü wählen.');
  openMenu('select'); // beim Start immer die Spielauswahl; muehle:lastGame markiert nur die Kachel
  if(store.get('newVersion',false)) noteNewVersion();
  if('serviceWorker' in navigator){
    let controlled=!!navigator.serviceWorker.controller; // erste Installation ist keine Aktualisierung
    navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(controlled) noteNewVersion(); controlled=true; });
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  }
})();
</script>
</body>
</html>
